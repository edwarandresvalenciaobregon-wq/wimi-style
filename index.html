
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIMI STYLE | Tienda de ropa urbana</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:#fff;font-family:Arial,sans-serif}
header{background:#171717;padding:20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #444}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:65px;height:65px;object-fit:contain}
h1{font-size:27px;letter-spacing:2px;margin:0}
h1 span{color:#e12d3b}
a{color:inherit;text-decoration:none}
.wrap{max-width:1100px;margin:auto;padding:24px 18px}
.hero{background:linear-gradient(125deg,#2d2d2d,#161616 60%,#57151c);border:1px solid #454545;border-radius:20px;padding:35px 20px;text-align:center;margin-bottom:25px}
.hero img{display:block;width:min(100%,350px);height:260px;object-fit:contain;margin:auto}
.hero h2{font-size:clamp(28px,5vw,48px);margin:10px 0}
.hero p{color:#ccc}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:20px 0}
.filters button{background:#292929;color:white;border:1px solid #444;border-radius:25px;padding:11px 16px;cursor:pointer}
.filters button.active{background:#d52335;border-color:#d52335}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.product{background:#1d1d1d;border:1px solid #393939;border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.photo{height:230px;background:#303030;display:grid;place-items:center;position:relative;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.photo:focus-visible{outline:3px solid #e12d3b;outline-offset:-3px}
.photo-label{position:absolute;right:8px;bottom:8px;background:#000b;color:#fff;padding:5px 9px;border-radius:15px;font-size:11px}
.details{padding:16px;display:flex;flex-direction:column;flex:1}
.details h3{margin:0 0 10px}
.details small{color:#bbb;line-height:1.5}
.price{font-size:23px;font-weight:bold;margin:12px 0}
.buy{display:block;text-align:center;background:#15803d;border-radius:9px;padding:12px;margin-top:auto;font-weight:bold}
.empty{grid-column:1/-1;text-align:center;padding:35px;color:#bbb}
footer{text-align:center;padding:35px;color:#aaa}

/* VISOR DE FOTOS */
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.96);z-index:1000;display:none;align-items:center;justify-content:center;flex-direction:column;padding:55px 15px 35px}
.viewer.open{display:flex}
.viewer-close{position:absolute;top:15px;right:20px;background:#333;color:white;border:0;border-radius:50%;width:42px;height:42px;font-size:27px;cursor:pointer}
.viewer-content{width:100%;max-width:850px;display:flex;align-items:center;justify-content:center;gap:10px;flex:1;min-height:0}
.viewer-image-box{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.viewer-image{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s;user-select:none}
.viewer-arrow{background:#292929;color:white;border:1px solid #555;border-radius:50%;width:40px;height:40px;flex-shrink:0;font-size:25px;cursor:pointer}
.viewer-arrow:disabled{opacity:.2;cursor:default}
.viewer-bottom{text-align:center;padding-top:12px}
.viewer-title{font-size:18px;font-weight:bold;margin-bottom:8px}
.viewer-count{font-size:14px;color:#bbb;margin-bottom:10px}
.viewer-zoom{background:#d52335;color:white;border:0;border-radius:20px;padding:9px 18px;cursor:pointer;font-weight:bold}
body.viewer-active{overflow:hidden}

@media(max-width:500px){
header{padding:15px}
h1{font-size:22px}
.hero img{height:210px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.photo{height:155px}
.details{padding:11px}
.details h3{font-size:14px}
.price{font-size:18px}
.buy{font-size:12px;padding:10px 5px}
.viewer{padding:60px 8px 35px}
.viewer-content{gap:4px}
.viewer-arrow{width:32px;height:38px;font-size:20px}
}
</style>
</head>
<body>

<header>
<div class="brand">
<img src="logo-wimi.jpg" alt="Logo WIMI">
<h1>WIMI <span>STYLE</span></h1>
</div>
<a href="https://www.instagram.com/style_wimi/" target="_blank" rel="noopener">@style_wimi</a>
</header>

<main class="wrap">
<section class="hero">
<img src="logo-wimi.jpg" alt="WIMI STYLE">
<h2>Viste a tu estilo.</h2>
<p>El arte del buen vestir. Elige tu favorito y pide por WhatsApp.</p>
</section>

<h2>Nuestros productos</h2>
<nav class="filters" id="filters"></nav>
<div class="grid" id="products">
<div class="empty">Cargando productos...</div>
</div>
</main>

<footer>
WIMI STYLE · Pedidos por WhatsApp: +57 323 451 8033
</footer>

<!-- VISOR DE IMAGENES -->
<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Galería de productos">
<button class="viewer-close" id="closeViewer" aria-label="Cerrar">×</button>
<div class="viewer-content" id="viewerContent">
<button class="viewer-arrow" id="prevPhoto" aria-label="Foto anterior">‹</button>
<div class="viewer-image-box" id="viewerImageBox">
<img class="viewer-image" id="viewerImage" alt="Imagen del producto">
</div>
<button class="viewer-arrow" id="nextPhoto" aria-label="Foto siguiente">›</button>
</div>
<div class="viewer-bottom">
<div class="viewer-title" id="viewerTitle"></div>
<div class="viewer-count" id="viewerCount"></div>
<button class="viewer-zoom" id="zoomButton">Ampliar imagen +</button>
</div>
</div>

<script>
const SUPABASE_URL =
'https://tltuamysrgrswrtclosq.supabase.co';

const SUPABASE_KEY =
'sb_publishable_HYapg10H-uye0CDsRt7EtA_PH2TDgEw';

const categorias = [
'Todos',
'Camisetas',
'Jeans',
'Gorras',
'Pantalonetas',
'Conjuntos'
];

let actual = 'Todos';
let productos = [];
let fotosActuales = [];
let indiceFoto = 0;
let ampliada = false;
let ultimoFoco = null;

const pesos = n =>
n ? new Intl.NumberFormat('es-CO',{
style:'currency',
currency:'COP',
maximumFractionDigits:0
}).format(n) : 'Consultar precio';

function escapar(valor){
return String(valor ?? '').replace(/[&<>"']/g,c=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#39;'
}[c]));
}

function imagenesProducto(p){
const fotos = [];

function agregar(valor){
if(typeof valor === 'string' && valor.trim()){
const url = valor.trim();
if(/^https?:\/\//i.test(url) || (
!url.startsWith('//') &&
!url.startsWith('javascript:') &&
!url.startsWith('data:') &&
!url.startsWith('vbscript:')
)){
if(!fotos.includes(url)) fotos.push(url);
}
}
}

agregar(p.imagen_url);

let extras = p.imagenes;

if(typeof extras === 'string'){
try{
extras = JSON.parse(extras);
}catch(e){
extras = extras.split(/\r?\n|,/);
}
}

if(Array.isArray(extras)){
extras.forEach(agregar);
}

return fotos;
}

function mostrarProductos(){

const filtros = document.getElementById('filters');

filtros.innerHTML = categorias.map(c=>`
<button data-cat="${escapar(c)}" class="${c===actual?'active':''}">
${escapar(c)}
</button>
`).join('');

filtros.querySelectorAll('button').forEach(b=>{
b.onclick=()=>{
actual=b.dataset.cat;
mostrarProductos();
};
});

const lista=productos.filter(p=>
actual==='Todos' || p.categoria===actual
);

const contenedor=document.getElementById('products');

if(!lista.length){
contenedor.innerHTML='<div class="empty">No hay productos en esta categoría.</div>';
return;
}

contenedor.innerHTML=lista.map((p,i)=>{

const mensaje=`Hola WIMI STYLE, quiero información sobre ${p.nombre}. Precio: ${pesos(p.precio)}. ¿Está disponible?`;

const whatsapp='https://wa.me/573234518033?text='+
encodeURIComponent(mensaje);

const fotos=imagenesProducto(p);

return `
<article class="product">
<div class="photo" data-index="${i}" tabindex="${fotos.length?0:-1}" role="${fotos.length?'button':'img'}" aria-label="${fotos.length?'Ver fotos de '+escapar(p.nombre):'Sin imagen'}">
${fotos.length
? `<img src="${escapar(fotos[0])}" alt="${escapar(p.nombre)}" loading="lazy">
<span class="photo-label">${fotos.length>1?fotos.length+' fotos · Ver':'Ver foto +'}</span>`
: 'Sin imagen'}
</div>
<div class="details">
<h3>${escapar(p.nombre)}</h3>
<small>${escapar(p.descripcion)}</small>
<div class="price">${pesos(p.precio)}</div>
<a class="buy" href="${whatsapp}" target="_blank" rel="noopener">
Pedir por WhatsApp
</a>
</div>
</article>
`;

}).join('');

contenedor.querySelectorAll('.photo').forEach(el=>{
const p=lista[Number(el.dataset.index)];
if(!imagenesProducto(p).length) return;

el.addEventListener('click',()=>abrirVisor(p));
el.addEventListener('keydown',e=>{
if(e.key==='Enter'||e.key===' '){
e.preventDefault();
abrirVisor(p);
}
});
});
}

function abrirVisor(p){
fotosActuales=imagenesProducto(p);
if(!fotosActuales.length) return;

indiceFoto=0;
ampliada=false;
ultimoFoco=document.activeElement;
document.getElementById('viewerTitle').textContent=p.nombre;
document.getElementById('viewer').classList.add('open');
document.body.classList.add('viewer-active');
actualizarVisor();
document.getElementById('closeViewer').focus();
}

function actualizarVisor(){
const img=document.getElementById('viewerImage');
img.src=fotosActuales[indiceFoto];
img.alt='Foto '+(indiceFoto+1)+' de '+fotosActuales.length;
img.style.transform='scale(1)';
ampliada=false;

document.getElementById('viewerCount').textContent=
'Foto '+(indiceFoto+1)+' de '+fotosActuales.length;

document.getElementById('zoomButton').textContent='Ampliar imagen +';

const varias=fotosActuales.length>1;
document.getElementById('prevPhoto').disabled=!varias;
document.getElementById('nextPhoto').disabled=!varias;
}

function cambiarFoto(paso){
if(fotosActuales.length<2) return;
indiceFoto=(indiceFoto+paso+fotosActuales.length)%fotosActuales.length;
actualizarVisor();
}

function cerrarVisor(){
document.getElementById('viewer').classList.remove('open');
document.body.classList.remove('viewer-active');
fotosActuales=[];
if(ultimoFoco && ultimoFoco.isConnected) ultimoFoco.focus();
}

function alternarZoom(){
ampliada=!ampliada;
document.getElementById('viewerImage').style.transform=
ampliada?'scale(1.8)':'scale(1)';
document.getElementById('zoomButton').textContent=
ampliada?'Quitar zoom −':'Ampliar imagen +';
}

document.getElementById('closeViewer').onclick=cerrarVisor;
document.getElementById('prevPhoto').onclick=()=>cambiarFoto(-1);
document.getElementById('nextPhoto').onclick=()=>cambiarFoto(1);
document.getElementById('zoomButton').onclick=alternarZoom;
document.getElementById('viewerImage').onclick=alternarZoom;

document.getElementById('viewer').addEventListener('click',e=>{
if(e.target.id==='viewer') cerrarVisor();
});

document.addEventListener('keydown',e=>{
if(!document.getElementById('viewer').classList.contains('open'))return;
if(e.key==='Escape') cerrarVisor();
if(e.key==='ArrowLeft') cambiarFoto(-1);
if(e.key==='ArrowRight') cambiarFoto(1);
if(e.key==='Tab'){
const controles=[
document.getElementById('closeViewer'),
document.getElementById('prevPhoto'),
document.getElementById('nextPhoto'),
document.getElementById('zoomButton')
].filter(el=>!el.disabled);
const primero=controles[0];
const ultimo=controles[controles.length-1];
if(e.shiftKey && document.activeElement===primero){
e.preventDefault();ultimo.focus();
}else if(!e.shiftKey && document.activeElement===ultimo){
e.preventDefault();primero.focus();
}
}
});

let inicioX=0;
document.getElementById('viewerImageBox').addEventListener('touchstart',e=>{
inicioX=e.changedTouches[0].screenX;
},{passive:true});

document.getElementById('viewerImageBox').addEventListener('touchend',e=>{
const diferencia=e.changedTouches[0].screenX-inicioX;
if(Math.abs(diferencia)>45){
cambiarFoto(diferencia<0?1:-1);
}
},{passive:true});

async function cargarProductos(){
try{
const respuesta=await fetch(
SUPABASE_URL+'/rest/v1/productos?select=*&order=created_at.desc',
{
headers:{
'apikey':SUPABASE_KEY
}
}
);

if(!respuesta.ok){
throw new Error('Error al consultar Supabase: '+respuesta.status);
}

const datos=await respuesta.json();

productos=datos.map(p=>({
nombre:p.nombre || 'Producto',
categoria:p.categoria || 'Camisetas',
precio:Number(p.precio)||0,
descripcion:p.descripcion || 'Consultar disponibilidad',
imagen_url:p.imagen_url || '',
imagenes:p.imagenes || []
}));

mostrarProductos();

}catch(error){
console.error(error);
document.getElementById('products').innerHTML=
'<div class="empty">No se pudieron cargar los productos. Revisa la conexión con Supabase.</div>';
}
}

cargarProductos();
</script>
</body>
</html>
