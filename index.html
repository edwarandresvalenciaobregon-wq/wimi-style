<style>
:root{--rojo:#e31e38;--plata:#f2f4f8}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:white;font-family:Arial,sans-serif;background:radial-gradient(ellipse at 85% 8%,#320c15,transparent 40%),#0d0d0f;overflow-x:hidden}
a{color:inherit;text-decoration:none}
header{position:relative;z-index:3;background:#141315ee;padding:17px max(4%,20px);border-bottom:1px solid #42242b;display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:58px;height:58px;object-fit:contain}
.brand h1{font-size:clamp(18px,3vw,27px);letter-spacing:2px;margin:0}
.brand h1 span{color:#ff344e}
header>a{font-size:14px;color:#eee}
.wrap{max-width:1130px;margin:auto;padding:29px 18px}

.hero{
  min-height:555px;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  text-align:center;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:24px;
  border:1px solid #74424b;
  background:radial-gradient(ellipse at 86% 64%,#62121e 0%,#280e14 32%,transparent 60%),linear-gradient(125deg,#18191c,#0d0e12 58%,#340b12);
  box-shadow:0 22px 50px #0008,inset 0 0 32px #fd2c3e20;
  margin-bottom:35px;
  padding:100px 16px 73px
}
.hero:before{
  content:"";
  position:absolute;
  pointer-events:none;
  inset:0;
  border:12px solid transparent;
  box-shadow:inset 0 0 7px #fafcfa80,inset 0 0 24px #d8eff222;
  border-radius:24px;
  z-index:1
}
.hero:after{
  content:"";
  position:absolute;
  pointer-events:none;
  left:0;
  right:0;
  top:0;
  height:20px;
  background:linear-gradient(180deg,#f7fbffdb 0%,#d5e6f5aa 23%,#eef7fbaa 38%,transparent 100%);
  filter:blur(1.5px);
  border-radius:50% 50% 40% 40%;
  opacity:.85;
  z-index:4
}

.lights{
  position:absolute;
  top:23px;
  left:8%;
  width:84%;
  height:32px;
  border-top:2px solid #49403b;
  border-radius:50% 50% 0 0;
  display:flex;
  justify-content:space-around;
  z-index:5
}
.lights i{
  width:12px;
  height:17px;
  border-radius:50%;
  background:#ff3245;
  box-shadow:0 0 10px #ff3345,0 0 22px #ff3445;
  animation:brillar 1.5s infinite alternate;
  position:relative;
  top:8px
}
.lights i:nth-child(3n){
  background:#ffd16a;
  box-shadow:0 0 11px #ffd16a,0 0 22px #ffd16a;
  animation-delay:.5s
}
.lights i:nth-child(3n+2){
  background:#fff6dc;
  box-shadow:0 0 11px #fff2d5,0 0 22px #fdd780;
  animation-delay:1s
}
.lights i:before{
  content:"";
  position:absolute;
  top:-5px;
  left:3px;
  width:6px;
  height:6px;
  background:#555;
  border-radius:2px
}
@keyframes brillar{
  from{opacity:.35;filter:brightness(.65)}
  to{opacity:1;filter:brightness(1.3)}
}

.corner{
  position:absolute;
  z-index:4;
  top:5px;
  font-size:66px;
  filter:drop-shadow(0 7px 8px #000);
  line-height:1
}
.corner.left{left:0;transform:rotate(-21deg)}
.corner.right{right:0;transform:scaleX(-1) rotate(-21deg)}
.corner:after{
  content:"🔴";
  font-size:17px;
  position:absolute;
  bottom:3px;
  left:31px
}

.hero-content{
  position:relative;
  z-index:3;
  max-width:760px
}

/* NUEVO BLOQUE DEL MUÑECO */
.logo-wrap{
  width:210px;
  margin:0 auto 18px;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
}
.logo-card{
  width:150px;
  height:240px;
  background:#050505;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 12px 30px #000a, inset 0 0 14px #ffffff12;
  border:1px solid #2a2a2a;
  position:relative;
}
.logo-card img{
  width:125px;
  height:auto;
  object-fit:contain;
  display:block;
  filter:drop-shadow(0 8px 12px #0009);
}
.hat{
  position:absolute;
  top:-10px;
  right:18px;
  width:92px;
  height:58px;
  background:var(--rojo);
  border-radius:85% 15% 8% 9%;
  transform:rotate(14deg);
  box-shadow:inset -9px 3px 12px #8d0b24;
  z-index:4
}
.hat:before{
  content:"";
  position:absolute;
  left:-5px;
  bottom:-2px;
  width:88px;
  height:18px;
  background:#fff;
  border-radius:40px;
  transform:rotate(-5deg);
  box-shadow:0 3px 6px #0005
}
.hat:after{
  content:"";
  position:absolute;
  right:-12px;
  top:27px;
  width:25px;
  height:25px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 2px 8px #fff8
}

.hero h2{
  font-size:clamp(31px,5.5vw,51px);
  font-weight:800;
  letter-spacing:-.8px;
  margin:8px 0 7px;
  text-shadow:0 4px 8px #0006
}
.underline{
  height:8px;
  width:235px;
  max-width:60%;
  background:var(--rojo);
  transform:skewX(-23deg) rotate(-2deg);
  clip-path:polygon(2% 50%,100% 0,88% 85%,0 100%);
  margin:0 auto 20px
}
.hero p{
  font-size:clamp(14px,2vw,18px);
  line-height:1.5;
  color:#f0e9ea;
  margin:0
}
.hero .snowflake{
  position:absolute;
  z-index:2;
  top:70%;
  font-size:33px;
  color:#f3f7ff;
  text-shadow:0 0 10px white
}
.snowflake.a{left:26%}
.snowflake.b{right:23%}

.gift-group{
  position:absolute;
  left:24px;
  bottom:28px;
  z-index:2;
  display:flex;
  align-items:flex-end;
  gap:9px
}
.gift{
  position:relative;
  width:116px;
  height:110px;
  border-radius:5px;
  background:linear-gradient(125deg,#29292e,#0a0b0f);
  box-shadow:11px 14px 20px #000a,inset 1px 1px 4px #a6a7a655;
  border-top:11px solid #323039
}
.gift.small{width:73px;height:66px}
.gift:before{
  content:"";
  position:absolute;
  left:44%;
  top:-11px;
  width:13px;
  height:100%;
  background:#ab081d;
  box-shadow:1px 0 6px #ff4c5e66
}
.gift:after{
  content:"🎀";
  position:absolute;
  top:-44px;
  left:30%;
  font-size:48px;
  filter:drop-shadow(0 2px 4px #000)
}

.ornaments{
  position:absolute;
  right:43px;
  bottom:31px;
  display:flex;
  align-items:flex-end;
  gap:17px;
  z-index:2
}
.ball{
  width:77px;
  height:77px;
  border-radius:50%;
  background:radial-gradient(circle at 31% 25%,#ffe5e7,#ca0825 28%,#660717 83%);
  box-shadow:0 8px 16px #0009,0 0 14px #e21e3538;
  position:relative
}
.ball:before{
  content:"";
  position:absolute;
  left:32px;
  top:-13px;
  width:14px;
  height:12px;
  border:2px solid #c9c3a6;
  border-radius:3px;
  background:#ac875c
}
.ball.silver{
  width:48px;
  height:48px;
  background:radial-gradient(circle at 29% 28%,#fff,#aab4bc 41%,#515765 93%)
}
.ball.silver:before{left:18px}

.hero-bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  height:19px;
  background:linear-gradient(transparent,#dbeaf1ad);
  filter:blur(7px);
  pointer-events:none
}

.wrap>h2{font-size:clamp(23px,3vw,28px);margin:0 0 19px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}
.filters button{background:#292929;border:1px solid #444;color:#fff;border-radius:25px;padding:11px 17px;cursor:pointer;font-weight:600}
.filters button:hover,.filters button.active{background:var(--rojo);border-color:var(--rojo)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.product{background:#1c1b1e;border:1px solid #403039;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 9px 26px #0005}
.photo{height:230px;background:#303030;display:grid;place-items:center;position:relative;cursor:pointer}
.photo img{width:100%;height:100%;object-fit:cover}
.photo:focus-visible{outline:3px solid #ef334b;outline-offset:-3px}
.photo-label{position:absolute;right:8px;bottom:8px;background:#000b;color:#fff;padding:5px 9px;border-radius:15px;font-size:11px}
.details{padding:16px;display:flex;flex-direction:column;flex:1}
.details h3{margin:0 0 10px}
.details small{color:#bbb;line-height:1.5}
.price{font-size:23px;font-weight:bold;margin:12px 0}
.buy{display:block;text-align:center;background:#15803d;border-radius:9px;padding:12px;margin-top:auto;font-weight:bold}
.buy:hover{background:#16a34a}
.empty{grid-column:1/-1;text-align:center;padding:35px;color:#bbb}
footer{text-align:center;padding:35px;color:#ccc;border-top:1px solid #332a2e}

#snow{position:fixed;inset:0;z-index:8;pointer-events:none;overflow:hidden}
#snow i{
  position:absolute;
  top:-25px;
  color:#f3faff;
  font-style:normal;
  opacity:.75;
  text-shadow:0 0 6px #fff9;
  animation:nevar linear infinite
}
@keyframes nevar{to{transform:translate3d(40px,110vh,0) rotate(240deg)}}

.viewer{position:fixed;inset:0;background:#000f;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;padding:55px 15px 35px}
.viewer.open{display:flex}
.viewer-close{position:absolute;top:15px;right:20px;background:#333;color:white;border:0;border-radius:50%;width:42px;height:42px;font-size:27px;cursor:pointer}
.viewer-content{width:100%;max-width:850px;display:flex;align-items:center;justify-content:center;gap:10px;flex:1;min-height:0}
.viewer-image-box{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}
.viewer-image{max-width:100%;max-height:100%;object-fit:contain;transition:transform .15s;user-select:none}
.viewer-arrow{background:#292929;color:white;border:1px solid #555;border-radius:50%;width:40px;height:40px;flex-shrink:0;font-size:25px;cursor:pointer}
.viewer-arrow:disabled{opacity:.2;cursor:default}
.viewer-bottom{text-align:center;padding-top:12px}
.viewer-title{font-size:18px;font-weight:bold;margin-bottom:8px}
.viewer-count{font-size:14px;color:#bbb;margin-bottom:10px}
.viewer-zoom{background:var(--rojo);color:white;border:0;border-radius:20px;padding:9px 18px;cursor:pointer;font-weight:bold}
body.viewer-active{overflow:hidden}

@media(max-width:600px){
  header{padding:13px}
  .brand img{width:45px;height:45px}
  .wrap{padding:17px 11px}
  .hero{min-height:475px;padding:70px 14px 68px;border-radius:17px}
  .logo-wrap{width:150px}
  .logo-card{width:110px;height:180px}
  .logo-card img{width:92px}
  .hat{transform:scale(.75) rotate(14deg);transform-origin:top right;right:-4px;top:-8px}
  .corner{font-size:37px}
  .lights{left:4%;width:92%}
  .lights i{width:8px;height:13px}
  .gift-group{left:12px;bottom:17px;transform:scale(.60);transform-origin:bottom left}
  .ornaments{right:11px;bottom:18px;transform:scale(.66);transform-origin:bottom right}
  .snowflake.a{left:7%}
  .snowflake.b{right:7%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .photo{height:155px}
  .details{padding:11px}
  .details h3{font-size:14px}
  .price{font-size:18px}
  .buy{font-size:12px;padding:10px 5px}
  .viewer{padding:60px 8px 35px}
  .viewer-content{gap:4px}
  .viewer-arrow{width:32px;height:38px;font-size:20px}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  #snow i,.lights i{animation:none}
}
</style>
